arazzo: 1.0.1
info:
  title: Safello — onboard a customer with BankID
  version: 1.0.0
  summary: BankID auth, email verification, terms acceptance, and KYC to reach a trade-ready customer.
  x-realizes-capability-ids:
  - BC-620.20
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-620.20
      capability_name: Identity & Access Management
      spec: safello-auth-api-openapi.yml
      confidence: 0.7
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: accountApi
  url: ../openapi/safello-account-api-openapi.yml
  type: openapi
- name: authApi
  url: ../openapi/safello-auth-api-openapi.yml
  type: openapi
workflows:
- workflowId: onboardCustomerBankId
  summary: Take a new end customer from BankID auth to KYC-complete.
  inputs:
    type: object
    properties:
      personalNumber: {type: string}
      email: {type: string}
  steps:
  - stepId: startBankId
    operationId: postOauth2Bankid
    requestBody:
      payload:
        personalNumber: $inputs.personalNumber
    outputs:
      requestId: $response.body#/request_id
  - stepId: obtainToken
    operationId: obtainToken
    requestBody:
      payload:
        grant_type: "urn:safello:params:oauth:grant-type:bankid"
        request_id: $steps.startBankId.outputs.requestId
    outputs:
      accessToken: $response.body#/access_token
  - stepId: getUser
    operationId: getUser
  - stepId: acceptTerms
    operationId: putV2AccountTerms
  - stepId: checkKyc
    operationId: getV2AccountKyc
  - stepId: getKycQuestions
    operationId: getV2AccountKycQuestions
  - stepId: answerKyc
    operationId: answerKyc
